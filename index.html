<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELLEVIEW ONLINE GAMES</title>
    <style>
        :root {
            --neon-purple: #bc13fe;
            --neon-cyan: #00f3ff;
            --neon-gold: #ffd700;
            --dark-bg: #0d0e15;
            --panel-bg: #161925;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .game-container {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px var(--neon-purple), inset 0 0 10px rgba(0, 243, 255, 0.2);
            border: 2px solid var(--neon-cyan);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--neon-cyan);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-box {
            font-size: 1.1rem;
        }

        .stat-value {
            font-weight: bold;
            color: var(--neon-gold);
            text-shadow: 0 0 5px var(--neon-gold);
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 5px;
            background: #000;
            padding: 20px 10px;
            border-radius: 15px;
            border: 2px solid var(--neon-purple);
            box-shadow: inset 0 0 20px rgba(188, 19, 254, 0.5);
            margin-bottom: 25px;
            overflow: hidden;
        }

        .reel {
            width: 45px;
            height: 70px;
            background: #111;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 8px #fff;
            transition: transform 0.1s ease-out;
        }

        .reel.winner {
            color: var(--neon-gold);
            text-shadow: 0 0 10px var(--neon-gold), 0 0 20px var(--neon-gold);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bet-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .bet-input, .user-input {
            background: #000;
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 8px;
            width: 100px;
            border-radius: 5px;
            text-align: center;
            font-size: 1.1rem;
        }

        .user-input {
            width: 80%;
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-cyan);
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        button.btn-spin {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.2);
        }

        button.btn-spin:hover {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-purple);
        }

        button.active-auto {
            background: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 20px #ff0055;
        }

        .message-box {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .player-load-section {
            margin-top: 25px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .owner-panel {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
        }

        .owner-title {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .owner-slider {
            width: 50%;
            accent-color: var(--neon-purple);
        }

        .admin-fields {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            max-width: 300px;
            margin: 20px auto 0 auto;
        }

        .admin-input {
            background: #000;
            border: 1px solid var(--neon-purple);
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            width: 100%;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .generated-code-box {
            margin-top: 15px;
            font-family: monospace;
            background: #111;
            padding: 10px;
            border: 1px solid var(--neon-gold);
            color: var(--neon-gold);
            font-size: 0.9rem;
            word-break: break-all;
            user-select: all;
            display: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>BELLEVIEW</h1>
        <div class="subtitle">Online Games</div>

        <div class="stats-container">
            <div class="stat-box">Balance: <span id="balance" class="stat-value">₱0</span></div>
            <div class="stat-box">Last Win: <span id="last-win" class="stat-value">₱0</span></div>
        </div>

        <div class="slot-machine">
            <div class="reel" id="r1">B</div>
            <div class="reel" id="r2">E</div>
            <div class="reel" id="r3">L</div>
            <div class="reel" id="r4">L</div>
            <div class="reel" id="r5">E</div>
            <div class="reel" id="r6">V</div>
            <div class="reel" id="r7">I</div>
            <div class="reel" id="r8">E</div>
            <div class="reel" id="r9">W</div>
        </div>

        <div class="controls">
            <div class="bet-control">
                <label for="bet">BET AMOUNT:</label>
                <input type="number" id="bet" class="bet-input" value="10" min="1">
            </div>
            <div class="btn-group">
                <button class="btn-spin" id="spin-btn" onclick="spin()">SPIN</button>
                <button id="auto-btn" onclick="toggleAuto()">AUTO SPIN</button>
            </div>
        </div>

        <div class="message-box" id="message">✨ MANGHINGI NG LOAD SA OWNER PARA MAKAPAGLARO! ✨</div>

        <!-- PLAYER LOAD & CASH-OUT INTERFACE -->
        <div class="player-load-section">
            <div style="font-size: 0.9rem; margin-bottom: 8px; color: var(--neon-cyan)">💸 PLAYER STATION (CASH-IN / CASH-OUT)</div>
            <input type="text" id="load-code-input" class="user-input" placeholder="I-paste dito ang Load Code mula kay Admin"><br>
            <button style="padding: 6px 15px; font-size: 0.8rem; margin-top: 8px;" onclick="redeemLoadCode()">REDEEM LOAD</button>
            <button style="padding: 6px 15px; font-size: 0.8rem; margin-top: 8px; border-color: #ff0055;" onclick="generateWithdrawCode()">CASH-OUT CODE</button>
            <div id="withdraw-output" class="generated-code-box"></div>
        </div>

        <!-- SECRET OPERATOR CONTROLS -->
        <div class="owner-panel">
            <div class="owner-title">🕵️‍♂️ SECRET OWNER'S PANEL (WIN RATE & LOAD CONTROLLER)</div>
            
            <div class="slider-container">
                <span style="font-size:0.8rem;">WIN RATE:</span>
                <input type="range" id="win-rate-slider" class="owner-slider" min="1" max="100" value="18" oninput="updateWinRateDisplay()">
                <span id="win-rate-disp" style="color: #ff0055; font-weight: bold;">18%</span>
